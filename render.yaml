# ============================================
# RENDER DEPLOYMENT CONFIGURATION
# ============================================
#
# API Only deployment (api.rkch.tech):
#   - Serves API endpoints only
#   - Frontend deployed separately on Vercel
#
# Build runs from the repo root.
# The server package lives in /server subdirectory.
#
# ============================================

services:
  # =========================
  # API ONLY (api.rkch.tech)
  # =========================
  - type: web
    name: rk-api
    env: node
    plan: free
    region: oregon
    rootDir: server

    buildCommand: npm install
    startCommand: node index.js

    envVars:
      - key: MODE
        value: api
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CLIENT_URLS
        value: https://rkch.tech,https://www.rkch.tech,https://preprod.rkch.tech,https://rk-website-navy.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EMAIL_SERVICE
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_KEY
        sync: false
